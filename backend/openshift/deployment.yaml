# ─────────────────────────────────────────────────────────────────────────────
# OpenShift manifests for Server Monitor
#
# Apply with:
#   oc apply -f openshift/deployment.yaml
# ─────────────────────────────────────────────────────────────────────────────

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: server-monitor-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: server-monitor-config
data:
  DATA_DIR:               "/mnt/data"
  SSH_MOCK_MODE:          "false"
  SSH_PORT:               "22"
  SSH_TIMEOUT:            "10"
  POLL_INTERVAL_SECONDS:  "300"
  POLL_MAX_WORKERS:       "10"
  HOST:                   "0.0.0.0"
  PORT:                   "8000"
  LOG_LEVEL:              "INFO"
  AUTH_TOKEN_TTL:         "28800"   # 8 hours; set to 0 to disable expiry

---
# ── Credentials Secret ────────────────────────────────────────────────────────
# Store sensitive values here — never in a ConfigMap.
# Encode values:  echo -n 'myvalue' | base64
# Or use stringData (OpenShift encodes automatically):
apiVersion: v1
kind: Secret
metadata:
  name: server-monitor-secret
type: Opaque
stringData:
  # SSH connection credentials
  SSH_USERNAME: "root"
  SSH_PASSWORD: ""
  # SSH_KEY_PATH: "/etc/ssh/id_rsa"

  # Application authentication credentials
  # Change these before deploying to production!
  AUTH_USERNAME: "redis"
  AUTH_PASSWORD: "redis123"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-monitor
  labels:
    app: server-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server-monitor
  template:
    metadata:
      labels:
        app: server-monitor
    spec:
      containers:
        - name: server-monitor
          image: image-registry.openshift-image-registry.svc:5000/<your-namespace>/server-monitor:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: server-monitor-config
            - secretRef:
                name: server-monitor-secret   # injects all Secret keys as env vars
          volumeMounts:
            - name: data
              mountPath: /mnt/data
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: server-monitor-data

---
apiVersion: v1
kind: Service
metadata:
  name: server-monitor
spec:
  selector:
    app: server-monitor
  ports:
    - port: 8000
      targetPort: 8000

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: server-monitor
spec:
  to:
    kind: Service
    name: server-monitor
  port:
    targetPort: 8000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
